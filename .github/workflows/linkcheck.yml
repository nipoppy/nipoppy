---
name: Check documentation links

on:
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 11 * * 0' # Weekly on Sunday at 11:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install package with doc dependencies
      run: |
        uv sync --no-dev --group doc

    - name: Generate JSON schemas for docs
      run: |
        uv run --no-sync python docs/scripts/pydantic_to_jsonschema.py
        uv run --no-sync python docs/scripts/process_template_json5_configs.py

    - name: Run linkcheck
      run: |
        uv run --no-sync python -m sphinx -b linkcheck -D linkcheck_timeout=30 docs/source/ docs/build/linkcheck

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install package with test dependencies
      run: |
        uv sync --no-dev --group test

    - name: Run pytest linkcheck tests
      run: |
        uv run --no-sync python -m pytest -m linkcheck
